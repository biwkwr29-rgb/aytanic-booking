<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านอายตานิค - บริการด้านความงามครบวงจร จ.ลพบุรี</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container" style="max-width:100% !important;width:98% !important;padding:0 16px !important;display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <a href="index.html" class="navbar-brand" style="white-space:nowrap !important;word-break:keep-all !important;display:inline-flex;align-items:center;gap:10px;flex-shrink:0;">
                <img src="images/eitanic-logo.jpg" alt="EITANIC Logo" style="width:34px;height:34px;border-radius:8px;object-fit:cover;">
                <span>ร้านอายตานิค</span>
            </a>
            <div class="navbar-menu" id="navMenu">
                <a href="home.html" class="active"><i class="fas fa-home"></i> หน้าแรก</a>
                <a href="profile.html"><i class="fas fa-id-card"></i> ข้อมูลลูกค้า</a>
                <a href="services.html"><i class="fas fa-concierge-bell"></i> โปรแกรมบริการ</a>
                <a href="booking.html"><i class="fas fa-calendar-plus"></i> จองคิว</a>
                <a href="payment.html"><i class="fas fa-credit-card"></i> ชำระเงิน</a>
            </div>
            <button class="navbar-toggle" onclick="document.getElementById('navMenu').classList.toggle('open')">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content slide-up">
                <h1>✨ ร้านอายตานิค ✨</h1>
                <p class="subtitle">Artanic Beauty Salon</p>
                <p>บริการด้านความงามครบวงจร ดูแลคุณด้วยใจ ในบรรยากาศสุดหรู<br>สาขาลพบุรี พร้อมให้บริการทุกวัน</p>
                <div class="hero-buttons" id="heroAuthButtons">
                    <a href="index.html" class="btn btn-secondary" style="background:#fff;color:var(--primary);border:1.5px solid var(--primary);"><i class="fas fa-book-open"></i> วิธีเข้าใช้งาน</a>
                    <a href="register.html" class="btn btn-primary"><i class="fas fa-user-plus"></i> สมัครสมาชิก</a>
                    <a href="login.html" class="btn btn-secondary"><i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ</a>
                </div>
            </div>
        </div>
    </section>

    <script src="js/app.js?v=8.0"></script>
    <script>
        let splashTimer = null;
        function dismissSplashScreen() {
            const splash = document.getElementById('appSplashScreen');
            if (splash && !splash.classList.contains('hide')) {
                splash.classList.add('hide');
                if (splashTimer) clearTimeout(splashTimer);
                setTimeout(() => {
                    if (splash && splash.parentNode) splash.remove();
                }, 550);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            splashTimer = setTimeout(dismissSplashScreen, 2500);
        });
    </script>
</body>
</html>
